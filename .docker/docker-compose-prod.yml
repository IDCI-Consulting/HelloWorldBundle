version: '3.3'

services:

  php:
    image: ${CONTAINER_RELEASE_IMAGE}
    environment:
      APP_ENV: prod
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - app_var:/var/www/idci_website/var
      - app_public_bundles:/var/www/idci_website/public/bundles
      - app_public_build:/var/www/idci_website/public/build
    configs:
      - source: php_config
        target: /usr/local/etc/php/php.ini
    networks:
      app: ~
      redis: ~

  nginx:
    image: nginx
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - app_public_bundles:/var/www/idci_website/public/bundles
      - app_public_build:/var/www/idci_website/public/build
    deploy:
      labels:
        traefik.frontend.rule: ${TRAEFIK_NGINX_FRONTEND_RULE}
        traefik.docker.network: "traefik_reverse-proxy"
        traefik.port: "80"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      app: ~
      traefik_reverse-proxy: ~

  static:
    image: nginx
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - app_public_bundles:/var/www/idci_website/public/bundles
      - app_public_build:/var/www/idci_website/public/build
    deploy:
      labels:
        traefik.frontend.rule: "${TRAEFIK_NGINX_FRONTEND_RULE};PathPrefix:/build/,/bundles/,/favicon.ico;Method:GET"
        traefik.docker.network: "traefik_reverse-proxy"
        traefik.port: "80"
    configs:
      - source: static_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      traefik_reverse-proxy: ~

  redis:
    image: redis:4
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - redis_data:/data
    networks:
      redis:
        aliases:
          - redis_session
      traefik_reverse-proxy: ~

volumes:
  app_var: ~
  app_public_bundles: ~
  app_public_build: ~
  redis_data: ~

configs:
  php_config:
    file: ./config/php.ini
  nginx_config:
    file: ./config/nginx.conf
  static_config:
    file: ./config/static.conf

networks:
  app: ~
  redis: ~
  traefik_reverse-proxy:
    external: true

