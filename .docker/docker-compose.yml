version: '3.3'

services:

  php:
    image: ${CONTAINER_RELEASE_IMAGE}
    environment:
      - APP_HOST
      - APP_ENV
      - APP_DEBUG
      - APP_VERSION
      - DATABASE_NAME
      - DATABASE_USERNAME
      - DATABASE_PASSWORD
      - DEV_USER_ID
      - DEV_GROUP_ID
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - composer:/var/www/.composer
      - var:/var/www/idci_website/var
      - bundles:/var/www/idci_website/public/bundles
      - ../:/var/www/idci_website
      - ../public/build:/var/www/idci_website/public/build
    configs:
      - source: php_config
        target: /usr/local/etc/php/php.ini
    networks:
      app: ~
      redis: ~

  nginx:
    image: nginx
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ../:/var/www/idci_website
    deploy:
      labels:
        traefik.frontend.rule: ${TRAEFIK_NGINX_FRONTEND_RULE}
        traefik.docker.network: "web_reverse_proxy"
        traefik.port: "80"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      app: ~
      web_reverse_proxy: ~

  static:
    image: nginx
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ../:/var/www/idci_website
    deploy:
      labels:
        traefik.frontend.rule: "${TRAEFIK_NGINX_FRONTEND_RULE};PathPrefix:/build/,/bundles/,/favicon.ico;Method:GET"
        traefik.docker.network: "web_reverse_proxy"
        traefik.port: "80"
    configs:
      - source: static_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      web_reverse_proxy: ~

  redis:
    image: redis:4
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - data:/data
    networks:
      redis:
        aliases:
          - redis_session
      web_reverse_proxy: ~

volumes:
  composer: ~
  data: ~
  var: ~
  bundles: ~

configs:
  php_config:
    file: ./config/php.ini
  nginx_config:
    file: ./config/nginx.conf
  static_config:
    file: ./config/static.conf

networks:
  app: ~
  redis: ~
  web_reverse_proxy:
    external: true
