twig:
    default_path: '%kernel.project_dir%/templates'
    form_themes: ['form_div_layout.html.twig', 'form/layout.html.twig']
    globals:
        app_version: '%env(APP_VERSION)%'
        app_env: '%env(APP_ENV)%'
        allow_robots: '%env(bool:ALLOW_ROBOTS)%'

when@test:
    twig:
        strict_variables: true
