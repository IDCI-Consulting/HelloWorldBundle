                    #Various
                    - {file: "new-year2017", image: "new-year2017.jpg", title: "Our wishes for 2017", date: "13-01-2017" , author: "Louise Millon", categories: ["Various"]}

                    #Symfony2
                    - {file: "idci-webpage-screenshot-bundle", image: "symfony2-logo.png", title: "IDCIWebPageScreenshotBundle", date: "11-09-2013" , author: "Baptiste Bouchereau", categories: ["Symfony2"]}
