twig:
    default_path: '%kernel.project_dir%/templates'
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    globals:
        menu:
            - {label: 'home', route: 'website_home'}
            - {label: 'our courses', route: 'website_courses'}
            - {label: 'the team', route: 'website_team'}
            - {label: 'our achievements', route: 'website_activities'}
            - {label: 'our partners', route: 'website_partners'}
            - {label: 'blog', route: 'website_blog'}
            - {label: 'contact', route: 'website_contact'}
        version:
            3.0
        locales:
            - fr
            - en
        courses:
            - 'symfony2'
            - 'oop-uml-scm'
            - 'html5-css3'
            - 'wordpress'
        idci_code_writer:
            files:
                -
                    url: https://raw.githubusercontent.com/IDCI-Consulting/GenealogyBundle/master/Controller/ImageController.php
                    language: 'php'
                    theme: ambiance

                -
                    url: https://raw.githubusercontent.com/IDCI-Consulting/GenealogyBundle/master/Repository/ElementRepository.php
                    language: 'php'
                    theme: monokai

                -
                    url: https://raw.githubusercontent.com/IDCI-Consulting/ExtraFormBundle/master/Controller/ApiController.php
                    language: 'php'
                    theme: tomorrow_night

                -
                    url: https://raw.githubusercontent.com/IDCI-Consulting/SimpleScheduleBundle/master/Entity/LocationAwareCalendarEntity.php
                    language: 'php'
                    theme: chaos

                -
                    url: https://raw.githubusercontent.com/IDCI-Consulting/SimpleScheduleBundle/master/Entity/CalendarEntityRelation.php
                    language: 'php'
                    theme: twilight

                -
                    url: https://raw.githubusercontent.com/IDCI-Consulting/SimpleMetadataBundle/master/Resources/views/Form/fields.html.twig
                    language: 'twig'
                    theme: cobalt

                -
                    url: https://raw.githubusercontent.com/IDCI-Consulting/BrowserCapabilities/master/js/codebarReader.js
                    language: 'javascript'
                    theme: clouds_midnight
                    