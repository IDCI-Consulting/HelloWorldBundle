achievements:
    chine_france:
        image_path: "/images/chine-france.png"
        url: "http://www.chine-france.com/"
        title: "Chine France"
        enabled: true
        content:
            fr: >
                Forte d’une vingtaine d’associations, La fédération des associations Franco-Chinoise entend constituer une structure privilégiée de dialogue avec la Chine et les Chinois de France.
                Elle vise à regrouper les associations œuvrant à promouvoir concrètement les relations d’amitié et de coopération entre la France et la Chine.
                Avec ce site multilingue, la F.A.F.C met à disposition de ses internautes, une base de données riche en informations, liens et documents qui viendront renforcer l'interaction entre la Chine et la France.
            en: >
                The F.A.F.C gathers about twenties associations together and aims to be a strong structure of dialogue between China and France Chineses.
                It seeks to unite associations working on friendship and cooperations promotions between China and France.
                The Federation provides a database with a lot of informations, links and documents, to reinforce interaction between these two countries.
                This website is multilingual.
        tools: ["wordpress"]
        services: ["development"]

    le_moniteur:
        image_path: "/images/moniteur.png"
        url: "http://lemoniteur.fr/"
        title: "Le moniteur"
        enabled: true
        content:
            fr: >
                lemoniteur.fr est un site d'informations pour les acteurs publics et privés de la construction et des collectivités locales.

                IDCI-Consulting est intervenu auprès d'eux pour un audit détaillé de l'ancienne version de leur site web.
                A la suite de cet audit, mise en place, développement et accompagnement des équipes sur le projet du nouveau site (mis en ligne en Mai 2011).
                Refonte du processus de création de compte (inscriptions) et de l'espace résérvé (Service Premium).
            en: >
                lemoniteur.fr is a news website to building professionals and local communities.


                IDCI-Consulting has carried out a detailed audit of the website old version, then develop and coach teams about the new website version.
                Also, reworking of account creation process (registration) and restricted area (Premium service).
        tools: ["wordpress"]
        services: ["development", "consulting"]


