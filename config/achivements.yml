    lesiris:
        image_path: "/images/lesiris.png"
        url: "http://www.lesiris.com/"
        title: "Le Siris"
        enabled: false
        content:
            fr: >
                Bienvenue au pays des volcans d'Auvergne ! Les 4 maisons, situées dans le département du Puy de Dôme en France, reçoivent des groupes toute l'année.
                Ce site est destiné aux écoles, colléges, lycées, club de sportifs, associations mais aussi au groupes
                d'étudiants ou d'adultes souhaitant par exemple venir se retrouver au centre de la France pour une réunion familiale.
                Tous les centres sont agrée Education Nationale, Jeunesse et Sport et deux d'entre eux sont Gites de france.
            en: >
        tools: ["pĥp", "symfony"]
