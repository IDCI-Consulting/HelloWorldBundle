    pmc_net:
        image_path: "/images/pmc-net.png"
        url: "http://pmc-net.net/"
        title: "PMC"
        enabled: false
        content:
            fr: >
                En 2015, Tessi renforce son pôle marketing services en faisant l’acquisition de PMC, l’agence conseil spécialiste du BOGO (Buy One Get One).
                Grâce à un savoir-faire et un réseau de partenaires uniques sur le marché, PMC propose des opérations qui permettent aux consommateurs d’accéder,
                en échange d’un simple achat, à des dotations extrêmement attractives.

                Tessi accorde sa confiance à IDCI-Consulting pour effectuer la refonte du site de l'agence.
            en: >
        tools: ["wordpress", "html5-css3"]
        services: ["development"]
