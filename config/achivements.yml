achievements:
    chine_france:
        image_path: "/images/chine-france.png"
        url: "http://www.chine-france.com/"
        title: "Chine France"
        enabled: true
        content:
            fr: >
                La Fédération des associations franco-chinoises a pour objectif de regrouper sur une seule et même structure une vingtaine d'associations qui contribuent à renforcer l'amitié entre la France et la Chine.
                La F.A.F.C propose à ses utilisateurs une base de données contenant des informations, des liens vers les associations et de la documentation culturelle.
                Le site web est disponible en anglais, français, et chinois.
            en: >
                The F.A.F.C gathers about twenties associations together which aim to reinforce dialogue between China and France Chineses.
                It seeks to unite associations working on friendship and cooperations promotions between these two countries.
                The Federation provides a database with a lot of informations, links and documents.
                This website is available in French, English and Chinese.
        tools: ["wordpress"]
        services: ["development"]

    le_moniteur:
        image_path: "/images/moniteur.png"
        url: "http://lemoniteur.fr/"
        title: "Le moniteur"
        enabled: true
        content:
            fr: >
                lemoniteur.fr est un site d'actualités à destination des acteurs publics et privés de la construction et des collectivités locales.

                Nous sommes intervenu auprès d'eux pour un audit détaillé de l'ancienne version du site web.
                Puis, nous avons développé, accompagné les équipes sur le projet de la nouvelle version (mise en ligne en mai 2011)
                et participé à la refonte du processus de création de compte (inscription) et de l'espace réservé (service Premium).
            en: >
                lemoniteur.fr is a news website to building professionals and local communities.


                We have carried out a detailed audit of the website old version, then develop and coach teams about the new website version.
                Also, reworking of account creation process (registration) and restricted area (Premium service).
        tools: ["wordpress"]
        services: ["development", "consulting"]


    www2012:
        image_path: "/images/www2012.png"
        url: "https://www2012.org"
        title: "www2012.org"
        enabled: true
        content:
            fr: >
                Le site web www2012 a été développé à l'occasion de la 21e Conférence Internationale World Wide Web,
                il rassemble les programmes, les partenaires et des documents concernant la conférence.

                Nous sommes devenu partenaire du consortium World Wide Web 2012 en conceptualisant et en implémentant
                la partie agenda interactive de la plate-forme du congrès qui s’est déroulé en Avril 2012.
            en: >
        tools: ["wordpress", "html5-css3"]
        services: ["development"]

    carglass:
        image_path: "/images/carglass.png"
        url: "https://www.carglass.fr/"
        title: "Carglass"
        enabled: true
        content:
            fr: >
                Refonte du site de Carglass pour améliorer la prise de rendez-vous d'un client lors d'un bris de glace
            en: >
        tools: ["php", "symfony2", "ansible", "oracle", "jira", "php unit", "gitlab", "jmeter"]
        services: ["development", "consulting"]

    allopneus:
        image_path: "/images/allopneus.png"
        url: "http://www.allopneus.com/"
        title: "Allopneus"
        enabled: true
        content:
            fr: >
                Tessi customer marketing appartient à Tessi, acteur leader sur le marché du traitement de flux en France.
                Tessi accompagne les entreprises depuis 40 ans dans la gestion de leurs éléments vitaux : documents et moyens de paiement, transactions devises et or, marketing client.

                En parrallèle du développement du site PMC, Tessi fait appel à IDCI-Consulting pour effectuer la refonte du site Tessi marketing services, qui deviendra Tessi customer marketing.
            en: >
        tools: ["wordpress", "html5-css3"]
        services: ["development"]

    optedif:
        image_path: "/images/optedif.png"
        url: "https://optedif-formation.fr/"
        title: "Optedif"
        enabled: true
        content:
            fr: >
                Optedif est un site basé sur la mise en relation de formateurs et d'apprenants.
                Le site web propose des formations dans de nombreux domaines et un espace personnel optimisé en fonction de votre profil.

                Nous avons participé à l'ajout de nouvelles fonctionnalités, l'amélioration du code source et la créations d'APIs.
            en: >
                Optedif is a website based on linking beetween teacher and learner.
                The website provide trainings in plenty of fields and an optimized personnal space depending on your profile.

                We took part in source code improvements, APIs and new functionnalities creation.
        tools: ["wordpress", "html5-css3"]
        services: ["development"]

    mapyourstories:
        image_path: "/images/mapyourstories.png"
        url: "https://mapyourstories.com/"
        title: "Map Your Stories"
        enabled: true
        content:
            fr: >
                Mapyourstories est un site web qui permet de créer des cartes de métro personnalisables et en temps réel.
                Chaque carte personnalisée peut être imprimé sur un support (tee-shirt, tote bag, etc) et offerte comme cadeau souvenir.

                Nous avons relevé le challenge en prenant en main le framework MétéorJS et en créant l'éditeur permettant de personnaliser sa map.
            en: >
                Mapyourstories is a website allowing to create cutomizable maps in collaboration and real time.
                Each map can be print on a tee-shirt, tote bag, etc, and offered as a gift.

                We have undertoken challenge by taking in charge of the MeteorJS framework and creating the editor allowing to customize your map.
        tools: ["wordpress", "html5-css3"]
        services: ["development"]

