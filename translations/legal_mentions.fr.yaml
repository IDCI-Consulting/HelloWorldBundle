section_2:
  title: 2 - Droits d'auteurs
  paragraph:  L’ensemble des éléments constituant le site internet ainsi que le site lui-même, relèvent des législations françaises sur les droits
              d’auteurs et les droits voisins du droit d’auteur.
              <br/><br/>
              Ces éléments sont la propriété exclusive de la société IDCI-Consulting.
              <br/><br/>
              La reproduction de tout ou partie de ce site est autorisée sous réserve de l'ajout de façon claire et lisible de la source
              (http://www.idci-consulting.fr) et de la mention "Droits réservés". Les informations utilisées ne doivent l'être à des fins personnelles,
              associatives ou professionnelles ; toute utilisation à des fins commerciales ou publicitaires est exclue.

section_3:
  title: 3 - Traitement des données personnelles
  paragraph:  Le visiteur peut contacter IDCI-Consulting, par le biais de son formulaire de contact ou son adresse mail.
              <br/><br/>
              IDCI-Consulting fera ses meilleurs efforts pour répondre à toute demande de contact adressée par un visiteur. Toutefois IDCI-Consulting
              ne s’engage en aucun cas à apporter une réponse ni à accuser réception de la demande du visiteur.
              <br/><br/>
              Les adresses électroniques recueillies dans le cadre du formulaire de contact sont seulement utilisées pour l'envoi d'informations.

section_4:
  title: 4 - Gestion des cookies
  paragraph: IDCI-consulting n'utilise aucun cookie sur son site web.