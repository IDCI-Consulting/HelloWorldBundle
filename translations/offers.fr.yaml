offers:
  title: Nos offres de service
  part_1:
    title: Votre problématique
    description:  <span class="section-offers-description-choice">Vous êtes une entreprise (PME/Groupe) et vous souhaitez :</span>
                  <br/><br/>
                  <ul>
                    <li>Être conseillé sur les choix technologiques et dans la conception de votre futur applicatif web</li>
                    <li>Renforcer temporairement votre équipe de développement</li>
                    <li>Former vos collaborateurs</li>
                    <li>Confier votre projet de mise en œuvre et rester concentré sur votre cœur de métier</li>
                  </ul>
                  <br/><br/>
                  <span class="section-offers-description-choice">Vous êtes une SSII et vous souhaitez :</span>
                  <br/><br/>
                  <ul>
                    <li>Renforcer vos ressources dans le cadre d’un projet</li>
                    <li>Déléguer ponctuellement un expert pour aider votre client à résoudre une problématique technique</li>
                    <li>Sous-traiter tout ou partie d’un contrat de services chez un de vos clients</li>
                    <li>Former vos collaborateurs ou ceux de vos clients sur les dernières technologies</li>
                  </ul>
  part_2:
    title: Une réponse innovante
    description:  'IDCI consulting (SARL) créée en 2007 est un groupement d’experts sur les technologies web
                  qui travaillent en permanence sur différentes missions tout en conservant la possibilité de
                  communiquer entre eux et ainsi partager leurs connaissances. Individuellement ou en équipe,
                  nous sommes capables d’apporter une valeur certaine pour votre projet à n’importe quelle
                  étape de son cycle de vie, sans engagement de votre part et sur une durée minimale de
                  collaboration. Nous intervenons exclusivement en régie.
                  <br/><br/>
                  En fonction de la charge et de l’expertise de vos équipes vous pouvez choisir de :
                  <br/><br/>
                  <ul>
                    <li>Déléguer tous les aspects techniques à IDCI et laisser vos équipes 100% concentrées sur l’implémentation des briques fonctionnelles liées à votre métier.</li>
                    <li>Avoir recours à une délégation partielle des tâches techniques à IDCI afin de combler vos besoins ponctuels en ressources et en expertise.</li>
                    <li>Vous assurer une collaboration et un support jusqu’à la totale maîtrise de votre projet</li>
                  </ul>
                  <br/><br/>
                  Cette organisation est la promesse d’un véritable partenariat offrant des avantages pour
                  chaque partie.
                  <br/><br/>
                  <span class="section-offers-description-choice bold-text">Pour le client :</span>
                  <br/><br/>
                  <ul>
                    <li>Mandater 1 consultant IDCI consulting et bénéficier d’un réseau multi-compétence</li>
                    <li>Bénéficier de moyens techniques et matériels supplémentaires (serveurs, locaux, communication.)/li>
                    <li>S’assurer d’un backup en cas d’urgence</li>
                    <li>D’optimiser les coûts de déplacement en faisant réaliser tout ou partie du mandat dans nos locaux en relation permanente avec le client</li>
                    <li>Avoir un 2e interlocuteur en charge de la relation et de la satisfaction client</li>
                  </ul>
                  <br/><br/>
                  <span class="section-offers-description-choice bold-text">Pour IDCI :</span>
                  <br/><br/>
                  <ul>
                    <li>Mutualiser les compétences</li>
                    <li>Maintenir et faire évoluer les connaissances de chacun</li>
                    <li>Travailler en suivant des standards suivis par la communauté et par notre équipe</li>
                  </ul>'