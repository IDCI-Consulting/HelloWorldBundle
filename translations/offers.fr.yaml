offers:
  call_to_action:
    box_1:
      title: 'Vous êtes <br/><span class="colored">une entreprise</span> (PME/Groupe)<br/> et vous souhaitez :'
      description:    <li>Être conseillé sur les <span class="colored">choix technologiques</span> et dans la <span class="colored">conception de votre futur applicatif web</span></li>
                      <li>Renforcer temporairement votre <span class="colored">équipe de développement</span></li>
                      <li>Former vos <span class="colored">collaborateurs</span></li>
                      <li><span class="colored">Confier votre projet</span> de mise en œuvre et rester concentré sur votre cœur de métier</li>
    box_2:
      title: 'Vous êtes <br/><span class="colored">une SN</span><br/> et vous souhaitez :'
      description:    <li><span class="colored">Renforcer vos ressources</span> dans le cadre d’un projet</li>
                      <li><span class="colored">Déléguer ponctuellement un expert</span> pour aider votre client à résoudre une problématique technique</li>
                      <li><span class="colored">Sous-traiter tout ou partie d’un contrat de services</span> chez un de vos clients</li>
                      <li><span class="colored">Former vos collaborateurs ou ceux de vos clients</span> sur les dernières technologies</li>

  company_concept:
    title: Une réponse innovante
    description:  IDCI consulting (SARL) créée en 2007 est un <span class="colored">groupement d’experts sur les technologies web</span>
                  qui travaillent en permanence sur différentes missions tout en conservant la possibilité de
                  communiquer entre eux et ainsi partager leurs connaissances. <span class="colored">Individuellement ou en équipe,</span>
                  nous sommes capables d’apporter une valeur certaine pour votre projet à n’importe quelle
                  étape de son cycle de vie, sans engagement de votre part et sur une durée minimale de
                  collaboration. Nous intervenons exclusivement en régie.

  options_list:
    title: En fonction de la charge et de l'expertise vos équipes
    subtitle: vous pouvez choisir...
    box_1:
      title: <span class="colored">Une délégation totale</span>
      description: Déléguer tous les aspects techniques à IDCI et laisser vos équipes 100% concentrées sur l’implémentation des briques fonctionnelles liées à votre métier.
    box_2:
      title: <span class="colored">Une délégation partielle</span>
      description: Déléger certaines tâches techniques à IDCI afin de combler vos besoins ponctuels en ressources et en expertise.
    box_3:
      title: <span class="colored">Du consulting</span>
      description: Vous assurer une collaboration et un support jusqu’à la totale maîtrise de votre projet
  
  consulting:
    title: Nous faisons du
    subtitle: Conseil et Expertise
    paragraph_1: Notre équipe fonctionne avant tout comme un centre de compétences. Nos experts aiment partager leur savoir et leur expérience. Nous savons intervenir à la demande, pour venir en support de vos développeurs lorsqu'ils se trouvent face à un défi technique.
    paragraph_2: Grâce à une veille technologique régulière, <span class="blue-colored-description-text">IDCI-Consulting renouvelle et enrichit ses connaissances techniques</span>.
    paragraph_3: Nous nous formons tous les jours à la recherche de l'excellence.
    paragraph_4: "Nous intervenons sur les différentes étapes de vos projets informatiques :</br><span class=\"blue-colored-description-text\">définition de vos objectifs, solutions techniques, architectures d'application web, déploiement et optimisation...</span>"

  courses:
    title: Nous faisons de la
    subtitle: Formation
    paragraph_1: Notre équipe fonde sa valeur ajoutée sur la quête perpétuelle de nouvelles connaissances. Ainsi, les partager est un véritable plaisir qui permet, de surcroît, à nos consultants de varier leurs missions et d'acquérir des compétences pédagogiques.
    paragraph_2: <span class="blue-colored-description-text">Forts de nos %cie_age% ans d'expériences</span>, nous pouvons intervenir ou animer des formations autour du développement <span class="blue-colored-description-text">d'application web à fort trafic</span> et des <span class="blue-colored-description-text">bonnes pratiques</span> par l'utilisation d'une stack DevOps complexe (conteneurisation (docker) + CI/CD (GitLab, Jenkins) + gestionnaire de version (Git) + tests (PHP Unit, Behat))
    paragraph_3: <i>Nous ne sommes pas un organisme de formation</i>.

  web_development:
    title: Nous faisons du
    subtitle: Développement web
    paragraph_1: IDCI dispose d'une expertise dans le développement web, spécialisée sur <span class="blue-colored-description-text">le framework PHP Symfony</span> (depuis la première version jusqu'aux plus récentes).
    paragraph_2: Plus encore, nous travaillons également avec le <span class="blue-colored-description-text">framework NodeJS</span>, et sommes toujours enthousiastes à l'idée de découvrir de <span class="blue-colored-description-text">nouvelles technologies</span> prometteuses.

  company_assets:
    title: 'Nos offres de services'
    box_1:
      title: <span class="colored">Faîtes confiance à IDCI</span>
      paragraph_1:  Nos consultants ne travaillent pas seuls. Bien entourés, ils fournissent des résultats <span class="colored">conformes aux attentes client</span> et aux normes du développement web.
      paragraph_2:  Notre organisation vous assure un <span class="colored">suivi continu</span> de vos projets, même en l'absence de votre consultant attitré.
      paragraph_3:  Nous possédons nos propres locaux pleinement équipés pour le travail à distance. Nous sommes donc <span class="colored">autonomes</span>.
      paragraph_4:  En cas de besoin, vous pouvez bénéficier d'<span class="colored">un second interlocuteur</span>.
    box_2:
      title: <span class="colored">Choisir IDCI Consulting, c’est optimiser la valeur ajoutée de votre partenaire :</span>
      paragraph_1:  En termes de compétences -<br>Vous mandatez un consultant et vous récoltez le <span class="colored">soutien technique de toute notre équipe</span> !
      paragraph_2:  En termes de coûts -<br>Nous possédons <span class="colored">nos propres locaux pleinement équipés pour le travail à distance</span>, ce qui a pour avantage d'éviter les frais de déplacement, d'améliorer le bilan carbone et d'optimiser vos coûts !
      paragraph_3:  En termes de sécurité -<br>Nos consultants sont backupés, ce qui sécurise votre projet. Le code produit est également revu par un autre développeur afin de respecter notre <span class="colored">engagement sur la qualité des livrables</span>.
