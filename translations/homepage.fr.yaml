company_concept:
  title: Une réponse innovante
  description:  IDCI consulting (SARL) créée en 2007 est un <span class="colored">centre de compétences sur les technologies web</span>
                qui travaille en permanence sur différentes missions tout en conservant la possibilité de
                communiquer entre eux et ainsi partager leurs connaissances. <span class="colored">Individuellement ou en équipe</span>,
                nous sommes capables d’apporter une valeur ajoutée pour votre projet quelle que soit
                étape de son cycle de vie. Nous intervenons exclusivement en régie.

methodology:
  subtitle: Notre méthodologie
  paragraph_1: Nous sommes <span class="blue-colored-description-text">flexibles</span>.</br>Les projets informatiques sont sujets à des changements très fréquents.
  paragraph_2: Notre experience nous a prouvé que les méthodes agiles sont sources de belles réussites, et nous nous efforçons de les appliquer dans les projets qui nous sont confiés.
  paragraph_3: Néanmoins, nous avons à cœur de nous intégrer au mieux à vos processus afin de garantir la synergie entre notre équipe, et la vôtre.

