courses:
  introduction:
    title: Nos formations
    problematics:
      title: Votre <span class="colored">problématique</span>
      paragraph_1: Vous êtes un <span class="colored">organisme de formation</span> et vous souhaitez vous adjoindre les compétences d’un consultant hautement qualifié pour animer une session ou concevoir un programme.
      paragraph_2: Vous êtes une <span class="colored">entreprise</span> (PME/Groupe) et vous souhaitez former vos collaborateurs.
      paragraph_3: Vous êtes une <span class="colored">SN</span> et souhaitez sous-traiter une prestation de formation auprès de vos clients ?
    solutions:
      title: Notre <span class="colored">solution</span>
      paragraph_1: Notre équipe fonde sa valeur ajoutée sur la quête perpétuelle de <span class="colored">nouvelles connaissances</span>. Ainsi, les partager est un véritable plaisir qui permet, de surcroît, à nos consultants de varier leurs missions et d'acquérir des compétences <span class="colored">pédagogiques</span>.
      paragraph_2: Confiez-nous <span class="colored">l'animation d'une session ou la conception d'une formation</span>. PHP, Symfony, Docker et Git n'ont plus beaucoup de secrets pour nous.
      paragraph_3: <i>Nous ne sommes pas un organisme de formation.</i>
  key_words:
    title: Quelques notions que nous maîtrisons
    project_management: Gestion de projet
    oop: Programmation Orientée Objet
    web_app: Application Web
    mvc: Architecture MVC
    web_dev: Développement Web