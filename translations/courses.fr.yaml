  subtitle: nos formations
  hour: heure
  duration: Durée
  introduction:
    part_1:
      title: Votre problématique
      paragraph_1: Vous êtes une entreprise (PME/Groupe) et vous souhaitez former vos collaborateurs.
      paragraph_2: Vous êtes une SN et souhaitez sous-traiter une prestation de formation auprès de vos clients ?
      paragraph_3: Vous êtes un organisme de formation et vous souhaitez vous adjoindre les compétences d’un consultant / formateur hautement qualifié pour animer une session.
    part_2:
      title: Nos formations
      paragraph_1: Notre équipe fonde sa valeur ajoutée sur la quête perpétuelle de nouvelles connaissances. Ainsi, les partager une fois maitrisées est un véritable plaisir qui permet de surcroît à nos consultants de varier le contenu de leurs missions et d’ajouter une branche pédagogique à leur background. Nous proposons des plans de formation 'standards' mais pouvons également répondre à des besoins plus spécifiques sur simple demande.