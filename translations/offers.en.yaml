offers:
  section_1:
    title: Our service offers
    box_1:
      title: 'You are <br/><span class="colored">a company</span> (SME/Group)<br/> and you want to :'
      description:    <li>Be advised on <span class="colored">technological choices</span> and on <span class="colored">your future web application conception</span></li>
                      <li>Offer temporary reinforcements to <span class="colored">your development team</span></li>
                      <li>Train your <span class="colored">collaborators</span></li>
                      <li><span class="colored">Leave us your project execution</span> and stay focus on your core business</li>
    
    box_2:
      title: 'You are <br/><span class="colored">a Software firm</span><br/> and you want :'
      description:    <li><span class="colored">Reinforce your resources</span> in the context of a project</li>
                      <li><span class="colored">Delegate punctually to an expert</span> to help your client in order to solve his technical issue</li>
                      <li><span class="colored">Subcontract an entire services contract</span> from your client, or just a part of it.</li>
                      <li><span class="colored">Train your collaborators, or your client\s ones</span>, on the new technologies.</li>

  section_2:
    title: An innovantive answer
    description:  'IDCI consulting (LLC), created in 2007, is a group of experts on the web technologies
                  that permanantly works on differnt missions while keeping the possibility to communicate with each other and share their knowledges. 
                  Individually or as a team, we are able to bring a certain value for your project at every step of its life cycle, 
                  without commitment from your side and on a minimal duration of collaboration. We exclusively intervene with IT management contracts.'

  section_3:
    title: Depending of the task and expertise of your teams
    subtitle: you can choose to...
    box_1: 
      description: Delegate every technical aspects to IDCI and let your teams keep 100% of their focus on your core business functionnal components implementation.
    box_2:
      description: Resort to a partial delegation of technical tasks to IDCI in order to fill your punctual needs of resources and expertise.
    box_3:
      description: Assure yourself a collaboration and a support until you totally master your project

  section_4:
    title: 'This organization is the promise of a real partnership offering benefits to both sides :'
    box_1:
      title: <span class="colored">For you</span>
      description:  '<li>Commission an IDCI Consulting consultant and <span class="colored">benefit from a multi-skills network</span></li>
                    <li><span class="colored">Benefit from technical ways and extra material</span> (servers, sites, communication.)</li>
                    <li><span class="colored">Insure yourself a backup</span> in emergency cases</li>
                    <li><span class="colored">Optimize moving costs</span> by realizing all, or just a part, of the commission in our sites, on permanent communication with the client</li>
                    <li>Get a second interlocutor in charge of the relation and the <span class="colored">satisfaction of the client</span></li>'
    box_2:
      title: <span class="colored">For us</span>
      description:  <li><span class="colored">Mutualize</span> the skills</li>
                    <li><span class="colored">Maintain and evolve knowledges</span> of each members</li>
                    <li><span class="colored">Work following standards</span> established by the community and our team</li>