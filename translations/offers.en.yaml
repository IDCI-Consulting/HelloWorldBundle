offers:
  title: Our service offers
  part_1:
    title: Your problematic
    description:  <span class="section-offers-description-choice">You are a company (SME/Group) and you want to :</span>
                  <br/><br/>
                  <ul>
                    <li>Be advised on technological choices and on your future web application conception</li>
                    <li>Offer temporary reinforcements to your development team</li>
                    <li>Train your collaborators</li>
                    <li>Leave us your project execution and stay focus on your core business</li>
                  </ul>
                  <br/><br/>
                  <span class="section-offers-description-choice">You are a Software firm and you want :</span>
                  <br/><br/>
                  <ul>
                    <li>Reinforce your resources in the context of a project</li>
                    <li>Delegate punctually to an expert to help your client in order to solve his technical issue</li>
                    <li>Subcontract an entire services contract from your client, or just a part of it.</li>
                    <li>Train your collaborators, or your client's ones, on the new technologies.</li>
                  </ul>
  part_2:
    title: An innovantive answer
    description:  'IDCI consulting (LLC), created in 2007, is a group of experts on the web technologies
                  that permanantly works on differnt missions while keeping the possibility to communicate with each other and share their knowledges. 
                  Individually or as a team, we are able to bring a certain value for your project at every step of its life cycle, 
                  without commitment from your side and on a minimal duration of collaboration. We exclusively intervene with IT management contracts.
                  <br/><br/>
                  Depending of the task and expertise of your teams, you can choose to :
                  <br/><br/>
                  <ul>
                    <li>Delegate every technical aspects to IDCI and let your teams keep 100% of their focus on your core business functionnal components implementation.</li>
                    <li>Resort to a partial delegation of technical tasks to IDCI in order to fill your punctual needs of resources and expertise.</li>
                    <li>Assure yourself a collaboration and a support until you totally master your project</li>
                  </ul>
                  <br/><br/>
                  This organization is the promise of a real partnership offering benefits to both sides.
                  <br/><br/>
                  <span class="section-offers-description-choice bold-text">For the client :</span>
                  <br/><br/>
                  <ul>
                    <li>Commission an IDCI Consulting consultant et benefit from a multi-skills network</li>
                    <li>Benefit from technical ways and extra material (servers, sites, communication.)</li>
                    <li>Insure yourself a back in emergency cases</li>
                    <li>Optimize moving costs by realizing all, or just a part, of the commission in our sites, on permanent communication with the client</li>
                    <li>Get a second interlocutor in charge of the relation and satisfaction of the client</li>
                  </ul>
                  <br/><br/>
                  <span class="section-offers-description-choice bold-text">For IDCI :</span>
                  <br/><br/>
                  <ul>
                    <li>Mutualize the skills</li>
                    <li>Maintain and evolve each members knowledges</li>
                    <li>Work following standards established by the community and our team'</li>
                  </ul>