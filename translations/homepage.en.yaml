  title: We are doing
  subtitle: Courses
  paragraph_1: <span class="blue-colored-description-text">Strong of our %cie_age% experience years</span>, wa can intervene or host courses around the development of <span class="blue-colored-description-text">web application with high traffic</span> and <span class="blue-colored-description-text">good practices</span> using a complex DevOps stack (containerisation (docker) + CI/CD (GitLab, Jenkins) + version manager (Git) + tests (PHP Unit, Behat)).

web_development:
  title: We are doing
  subtitle: Web development
  paragraph_1: IDCI is a web development expert company, specialized on <span class="blue-colored-description-text">PHP framework Symfony</span> (from the first to the lastest versions).
  paragraph_2: Moreover, we also develop our skills on the <span class="blue-colored-description-text">NodeJS framework</span>, and we are always enthusiastic at the idea to discover some <span class="blue-colored-description-text">new upcoming technologies</span>.

open_source:
  title: Our philosophy
  subtitle: Open source
  paragraph_1: <span class="green-colored-description-text">Sharing and openness</span> to others are anchored in the philosophy of our company.
  paragraph_2: For each of our projects, we contribute as soon as possible to <span class="green-colored-description-text">the development of open-source tools </span> that we use everyday, so everyone can keep growing and prospering, whether it be our clients or open-source community members.
  paragraph_3: We publish and maintain available source code on <a href="https://github.com/IDCI-Consulting" class="blue-colored-description-text" target="_blank">our Github repository.</a>

methodology:
  subtitle: Our methodology
  paragraph_1: We are <span class="blue-colored-description-text">flexibles</span>. Informatic projects are subject to very frequent changes.
  paragraph_2: Our experience showed us that Agile methods are source of great success, and we put effort appling it toward all the projects given to us.
  paragraph_3: For all that, we care integrating your process to ensure the synergy between our team, and yours.

