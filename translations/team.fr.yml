text.team.gabriel: Attiré par les nouvelles technologies depuis tout jeune,<br>je me suis passionné pour l'informatique  et plus précisément Internet et le Web par la suite.<br />J'ai fait de cette passion mon métier en entrant dans la vie active. Ma curiosité et le goût des défis m'ont amené à créer la société IDCI Consulting fin 2007.<br />La philosophie "Open Source" à fait de moi un libriste convaincu. La RFC 2616 est devenu mon "livre sacré" et le nombre 42 est souvent une réponse de choix aux problèmes qu'on me pose.
text.team.frederic: Issu auparavant du monde des services informatiques, je suis co-fondateur de IDCI consulting depuis 2007.<br />Je mets aujourd'hui mes 18 années d'expérience au service du développement de l'entreprise. Outre les orientations stratégiques que je détermine avec Gabriel et Baptiste, je gère en particulier les négociations commerciales, la finance et les HRs pour permettre à l'équipe opérationnelle de se concentrer sur son cœur de métier.
text.team.baptiste: Si je suis tombé dans le monde informatique par hasard, j'y suis resté par passion.<br />J'aime apprendre sans discontinuer et me servir de ces connaisances pour développer des applications qui facilitent le quotidien.<br />L'envie d'entreprendre m'a amené à rejoindre IDCI en temps qu'associé en 2015, et j'éspère découvrir chaque jour de nouveaux domaines d'activités en me plongeant dans l'univers professionnel de mes clients.
text.team.brahim: <blockquote cite="Albert Einstein">«Tout le monde est un génie. Mais si vous jugez un poisson sur ses capacités à grimper à un arbre, il passera sa vie à croire qu’il est stupide.» - Albert Einstein</blockquote><br />Au départ, le monde de l'informatique n'était pas un milieu familié.<br/>Après des nuits et jours d'apprentissage, je me suis passionné par ce domaine.<br />Aujourd'hui, j'aime transposer des idées en programme & partager mes connaissances.