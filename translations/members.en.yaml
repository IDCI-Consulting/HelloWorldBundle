  description: Previously from the world of IT services, I am co-founder of IDCI-Consulting since 2007. Today I put my 18 years of experience in the company's development. In addition to the strategic directions that I determine with Baptiste & Gabriel, I manage particularly trade negotiations, finance and HRs to allow the operations team to focus on his heart craft.

