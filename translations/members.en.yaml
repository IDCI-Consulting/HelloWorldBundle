  introduction: Humanity is the IDCI consulting ADN. Based on the synergy and specialties of everyone, our team first works in a continuous improvment optics of the quality and the methodologies. <br/><br/> More than a simple technical intervenant that will realise your project, we are involved from its conception to its maintenance trough its infrastructure and by guiding you on the long term to make it evolve and an always reach better performances. <br/><br/> Our consultants daily tax depends on their skills and their experiences. They are indicated on each CV. The ADR is decreased by 20% when the consultant work in our site.

