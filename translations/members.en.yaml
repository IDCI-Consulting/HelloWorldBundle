members:
  title: The team
  check_cv: See the CV
  introduction: Human is the IDCI consulting ADN. Frederic and Gabriel Bondaz founded the company in 2007, based on the synergy and specialties of everyone. Our team first work in a continuous improvment perspective of quality and methodologies. <br/><br/> More than a simple technical intervenant that will realise your project, we are involved from its conception to its maintenance through its infrastructure and by guiding you on the long term to make it evolve and always reach better performances. <br/><br/> Our consultants daily tax depends on their skills and their experiences. The ADR is decreased by 20% when the consultant work in our site.

gabriel:
  subtitle: Manager
  description: Attracted by new technologies since very young, I passionate about IT and more specifically Internet and Web thereafter. I made this passion my profession when entering the active life. My curiosity and taste of challenges I have to create the IDCI-Consulting company in end of 2007. The philosophy of "Open Source" make me a satisfied libriste. RFC 2616 has become my "holy book" and the number 42 is often a choice of response to the problems I get asked.

