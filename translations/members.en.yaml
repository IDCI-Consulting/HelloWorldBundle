vincent:
  subtitle: Developer
  description: Fascinated by the world of computers, I quickly became interested in the Web in my spare time, so it was a natural choice for me after High School. After graduating with a DUT in Computer Science, I decided to continue my studies at Poytech Lyon as a work-study student at IDCI-Consulting, where I am gaining experience day by day and deepening my skills and understanding of IT issues in business.

joris:
  subtitle: Developer
  description: Spending a huge part of my youth on my computer, I naturally turned myself towards computing. At the beginning, I didn't really felt in my place, but the experience I gained during my intership and my work-linked training at IDCI allowed me to understand all the possibilities in this domain and gave me the wish to deepen my knowledges. The freedom of creation and the diversity of projects that we can achieve is one of the aspects that please me the most in development.

maeva:
  subtitle: Developer
  description: I learned web development by myself, and now, I'm professionalizing my skills. I choose to trend myself towards web development for its diversity of aspects and technology which bring its batch of discoveries and progresses. The problematics of ergonomy, accessibility and maintainabilty encourage me to always improve me and better design my code.