image: docker:git

variables:
  CONTAINER_RELEASE_IMAGE: $CI_REGISTRY/idci/website/php-fpm
  DOCKER_HOST: $DOCKER_PROD_HOST
  DOCKR_DRIVER: overlay2

build-docker-image:
  stage: build
  variables:
      APP_VERSION: $CI_COMMIT_TAG
  script:
    - docker login -u $DOCKER_REGISTRY_LOGIN -p $DOCKER_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --cache-from $CONTAINER_RELEASE_IMAGE:latest -t $CONTAINER_RELEASE_IMAGE:latest -t $CONTAINER_RELEASE_IMAGE:$CI_COMMIT_TAG $CI_PROJECT_DIR -f .docker/php/Dockerfile
    - docker push $CONTAINER_RELEASE_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

deploy-to-pre-production:
  stage: deploy
  variables:
    APP_HOST: pre-prod.idci-consulting.fr
    APP_VERSION: $CI_COMMIT_TAG
    SERVICE_NAME: idci_website_pp
    TRAEFIK_NGINX_FRONTEND_RULE: Host:$APP_HOST
  script:
    - docker login -u $DOCKER_REGISTRY_LOGIN -p $DOCKER_REGISTRY_PASSWORD $CI_REGISTRY
    - docker stack deploy -c $CI_PROJECT_DIR/.docker/docker-compose-prod.yml --with-registry-auth ${SERVICE_NAME}
  environment:
    name: pre-production
    url: https://pre-prod.idci-consulting.fr/
  when: manual
  only:
    - tags

deploy-to-pre-production:
  stage: deploy
  variables:
    DOCKER_HOST: $DOCKER_PROD_HOST
    STACK_NAME: idci_website_pp
  image: docker:latest
  script:
    - docker login -u $DOCKER_REGISTRY_LOGIN -p $DOCKER_REGISTRY_PASSWORD $CI_REGISTRY
    - docker stack deploy $CI_PROJECT_DIR/docker-compose.yml
  environment:
    name: pre-production
    url: https://pre-prod.idci-consulting.fr/
  when: manual
  only:
    - tags
