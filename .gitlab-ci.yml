image: docker:git
services:
  - docker:dind

variables:
  CONTAINER_RELEASE_IMAGE: ${CI_REGISTRY}/idci-website/php-fpm
  STACK_NAME: idci_website

build-docker-image:
  stage: build
  script:
    - docker login -u ${DOCKER_REGISTRY_LOGIN} -p ${DOCKER_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --cache-from ${CONTAINER_RELEASE_IMAGE}:latest -t ${CONTAINER_RELEASE_IMAGE}:${CI_COMMIT_TAG} -t ${CONTAINER_RELEASE_IMAGE}:latest ${CI_PROJECT_DIR} -f .docker/Dockerfile
    - docker push ${CONTAINER_RELEASE_IMAGE}:${CI_COMMIT_TAG}
    - docker push ${CONTAINER_RELEASE_IMAGE}:latest
  only:
    - tags

start-production:
  stage: deploy
  variables:
    DOCKER_HOST: ${DOCKER_PROD_HOST}
  image: docker:latest
  script:
    - docker login -u ${DOCKER_REGISTRY_LOGIN} -p ${DOCKER_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker stack deploy -c ${CI_PROJECT_DIR}/.docker/docker-compose-prod.yml ${STACK_NAME}
  environment:
    name: production
    url: https://www.idci-consulting.fr/
    on_stop: stop-production
  when: manual
  only:
    - tags

stop-production:
  stage: deploy
  variables:
    DOCKER_HOST: ${DOCKER_PROD_HOST}
  image: docker:latest
  script:
    - docker stack rm ${STACK_NAME}
  environment:
    name: production
    url: https://www.idci-consulting.fr/
    action: stop
  when: manual
  only:
    - tags

update-production:
  stage: deploy
  variables:
    DOCKER_HOST: ${DOCKER_PROD_HOST}
  image: docker:latest
  script:
    - docker login -u ${DOCKER_REGISTRY_LOGIN} -p ${DOCKER_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker image pull ${CONTAINER_RELEASE_IMAGE}:${CI_COMMIT_TAG}
    - docker service update --force ${STACK_NAME}_php --image ${CONTAINER_RELEASE_IMAGE}:${CI_COMMIT_TAG}
  environment:
    name: production
    url: https://www.idci-consulting.fr/
    on_stop: stop-production
  when: manual
  only:
    - tags
