version: '2'

services:

  app:
    container_name: idci-website
    image: brah0um/silex-dev-idci
    volumes:
      - .:/var/www
      - /var/log/docker/nginx/idci/:/var/log/nginx
    environment:
     - VIRTUAL_HOST=dev.idci.fr
    ports:
     - 8078:80
     - 35729:35729
    restart: always

networks:

  default:
    external:
      name: dev
