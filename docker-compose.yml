version: '2'

services:
#
#  node:
#    image: idci-website/node:6.9.5 # Recommended version
#    container_name: idci-website-node
#    build:
#      context: docker/build/node6.9.5
#    volumes:
#      - ./:/usr/src/app

  php:
    image: idci-website/php:5.6-fpm
    container_name: idci-website-php
    build:
      context: docker/build/php5.6
    volumes:
      - ./:/var/www/html
#    depends_on:
#      - node

  nginx:
    image: nginx:1.10
    container_name: idci-website-nginx
    environment:
      - VIRTUAL_HOST=idci-website.docker
    volumes_from:
      - php
    volumes:
      - ./docker/conf/nginx/vhost_silex.conf:/etc/nginx/conf.d/default.conf
      - ./docker/conf/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php

networks:

  default:
    external:
      name: dev
