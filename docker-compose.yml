version: '3.3'

services:

  php:
    image: idci-website:master
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - composer:/var/www/.composer
      - ./:/var/www/idci_website
    configs:
      - source: php_config
        target: /usr/local/etc/php/php.ini
    networks:
      private: ~
      redis: ~
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DEV_USER_ID: 1000
      DEV_GROUP_ID: 1000

  nginx:
    image: nginx
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./:/var/www/idci_website
    deploy:
      labels:
        traefik.frontend.rule: "Host:www.idci.docker,idci.docker"
        traefik.docker.network: "web_reverse_proxy"
        traefik.port: "80"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      private: ~
      web_reverse_proxy: ~

  static:
    image: nginx
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./:/var/www/idci_website
    deploy:
      labels:
        traefik.frontend.rule: "Host:www.idci.docker,idci.docker;PathPrefix:/build/,/bundles/,/favicon.ico;Method:GET"
        traefik.docker.network: "web_reverse_proxy"
        traefik.port: "80"
    configs:
      - source: static_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      web_reverse_proxy: ~

  redis:
    image: redis:4
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - data:/data
    networks:
      redis:
        aliases:
          - redis_session
      web_reverse_proxy: ~

volumes:
  composer: ~
  data: ~

configs:
  php_config:
    file: ./.docker/config/php.ini
  nginx_config:
    file: ./.docker/config/nginx.conf
  static_config:
    file: ./.docker/config/static.conf

networks:
  private: ~
  redis: ~
  web_reverse_proxy:
    external: true
